[workspace]
resolver = "2"
members = [
    "crates/sshwarden-agent",
    "crates/sshwarden-api",
    "crates/sshwarden-ui",
    "crates/sshwarden-config",
]

[package]
name = "sshwarden"
version = "0.0.0-dev"
edition = "2021"
license = "GPL-3.0"
publish = false

[dependencies]
sshwarden-agent = { path = "crates/sshwarden-agent" }
sshwarden-api = { path = "crates/sshwarden-api" }
sshwarden-ui = { path = "crates/sshwarden-ui" }
sshwarden-config = { path = "crates/sshwarden-config" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = { version = "0.7" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
rpassword = "7"
serde = { workspace = true }
serde_json = { workspace = true }
ssh-key = { workspace = true, features = ["encryption", "ed25519", "rsa", "getrandom"] }
sha2 = "0.10"
sysinfo = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
rand = "0.8"
# Only the winit + femtovg backend is used; slint's default feature set also
# pulls in the Qt backend and the software renderer (png 0.17/0.18), which
# nothing here needs. Keep the feature list in sync with sshwarden-ui.
slint = { version = "1.15", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
rustls = { version = "0.23", features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_System_Console",
] }

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[workspace.package]
version = "0.0.0-dev"
license = "GPL-3.0"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bitwarden-russh = { git = "https://github.com/bitwarden/bitwarden-russh.git", rev = "a641316227227f8777fdf56ac9fa2d6b5f7fe662" }
bytes = "1.11"
futures = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key = { version = "0.6.7", default-features = false }
sysinfo = "0.37"
thiserror = "2"
tokio = { version = "1.48", features = ["io-util", "sync", "macros", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
# Keep the symbol table so an incident stack trace (eu-stack/gdb on a shipped
# binary) resolves to function names; full DWARF is still dropped.
strip = "debuginfo"
# `panic = "abort"` drops the unwinding tables and lets LTO remove more code.
# Mutex poisoning is still handled without unwinding: every `.lock()` site
# recovers via `unwrap_or_else(|e| e.into_inner())` rather than panicking.
panic = "abort"
